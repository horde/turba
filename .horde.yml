      horde/icalendar: ^3
      horde/mail: ^3
      horde/mime: ^3
      horde/nls: ^3
      horde/perms: ^3
      horde/prefs: ^3
      horde/serialize: ^3
      horde/share: ^3
      horde/support: ^3
      horde/url: ^3
      horde/util: ^3
      horde/vfs: ^3
      horde/view: ^3
      php81_bc/strftime: ^0.7
    ext:
      gettext: '*'
      hash: '*'
      json: '*'
  optional:
    composer:
      horde/activesync: ^3
      horde/backup: ^2
      horde/db: ^3
      horde/imsp: ^3
      horde/ldap: ^3
      horde/openxchange: ^2
  dev:
    composer:
      horde/test: ^3
      horde/activesync: ^3
      horde/backup: ^2
      horde/db: ^3
      horde/imsp: ^3
      horde/ldap: ^3
      horde/openxchange: ^2
autoload:
  classmap:
    - lib/
  psr-4:
    Horde\Turba\: src/
vendor: horde
keywords:
  - contacts
  - addressbook
